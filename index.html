<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bryce Larson</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Times New Roman", Times, serif;
      background: #0f1420;
    }

    .fade-overlay {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 200;
      animation: fadeOut 2.2s ease forwards;
      pointer-events: none;
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 150;
      width: 100%;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: rgba(15, 20, 32, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(201, 169, 110, 0.24);
    }

    .topbar-links {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .topbar-btn {
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      padding: 0.34rem 0.78rem;
      border-radius: 999px;
      background: transparent;
      color: #c9a96e;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .topbar-btn.active {
      background: #1b2c52;
      color: #f5f0e8;
    }

    .topbar-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.08);
      color: #f0d899;
      transform: translateY(-1px);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #f5f0e8;
      white-space: nowrap;
    }

    .topbar-photo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 1.5px solid #c9a96e;
      background: white;
    }

    .topbar-name {
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .scroll-container {
      width: 100%;
      height: 100vh;
      padding-top: 54px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: auto;
      scrollbar-color: #c9a96e #1a1a2e;
      background: #0f1420;
    }

    .scroll-container::-webkit-scrollbar {
      width: 12px;
    }

    .scroll-container::-webkit-scrollbar-track {
      background: #1a1a2e;
      margin-top: 54px;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background-color: #c9a96e;
      border-radius: 999px;
      border: 2px solid #1a1a2e;
    }

    .page {
      width: 100%;
      min-height: calc(100vh - 54px);
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0 1.5rem;
    }

    #home {
      background-image: url("website-images/Suzzallo_Library.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #home::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          rgba(15, 20, 32, 0.62),
          rgba(15, 20, 32, 0.78)
        );
      z-index: 1;
    }

    #experience,
    #projects,
    #writing,
    #contact {
      background:
        radial-gradient(circle at center, rgba(27, 44, 82, 0.45), transparent 45%),
        #0f1420;
    }

    .section-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      text-align: center;
      color: white;
    }

    .hero h1 {
      margin: 0 0 1.2rem 0;
      color: white;
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      font-weight: normal;
      letter-spacing: 0.2em;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.75);
    }

    .divider {
      width: 150px;
      height: 1px;
      background-color: #c9a96e;
      margin: 0 auto 1.4rem auto;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }

    .social-links a {
      color: #c9a96e;
      font-size: 2.4rem;
      text-decoration: none;
      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    .social-links a:hover {
      color: #f0d899;
      transform: translateY(-2px);
    }

    .section-content h2 {
      margin: 0;
      color: #f5f0e8;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: normal;
      letter-spacing: 0.15em;
    }

    .section-content p {
      margin-top: 0.8rem;
      color: #b8b8b8;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    .sidebar {
      position: fixed;
      right: 2rem;
      top: calc(54px + ((100vh - 54px) / 2));
      transform: translateY(-50%);
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .sidebar-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(201, 169, 110, 0.22);
      border-radius: 50%;
      background: rgba(15, 20, 32, 0.46);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background 0.25s ease,
        transform 0.25s ease,
        border-color 0.25s ease;
    }

    .sidebar-btn.active {
      background: #1b2c52;
      border-color: rgba(201, 169, 110, 0.7);
    }

    .sidebar-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.08);
    }

    .contact-card {
      width: min(520px, 92vw);
      padding: 2.2rem;
      border: 1px solid rgba(201, 169, 110, 0.35);
      border-radius: 18px;
      background: rgba(15, 20, 32, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      text-align: left;
    }

    .contact-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      letter-spacing: 0.1em;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin: 1rem 0;
      color: #f5f0e8;
      font-size: 1.08rem;
      letter-spacing: 0.03em;
    }

    .contact-row i {
      width: 28px;
      color: #c9a96e;
      font-size: 1.25rem;
      text-align: center;
    }

    .contact-row a {
      color: #f5f0e8;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .contact-row a:hover {
      color: #f0d899;
    }

    .contact-socials {
      display: flex;
      justify-content: center;
      gap: 1.7rem;
      margin-top: 1.8rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(201, 169, 110, 0.25);
    }

    .contact-socials a {
      color: #c9a96e;
      font-size: 2rem;
      text-decoration: none;
      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    .contact-socials a:hover {
      color: #f0d899;
      transform: translateY(-2px);
    }

    @media screen and (max-width: 760px) {
      .topbar {
        height: 50px;
        padding: 0 0.8rem;
      }

      .topbar-photo {
        width: 30px;
        height: 30px;
      }

      .topbar-name {
        font-size: 0.85rem;
        letter-spacing: 0.05em;
      }

      .topbar-links {
        gap: 0.12rem;
      }

      .topbar-btn {
        padding: 0.28rem 0.42rem;
        font-size: 0.78rem;
      }

      .scroll-container {
        padding-top: 50px;
      }

      .scroll-container::-webkit-scrollbar-track {
        margin-top: 50px;
      }

      .page {
        min-height: calc(100vh - 50px);
      }

      .hero h1 {
        letter-spacing: 0.14em;
      }

      .sidebar {
        right: 0.75rem;
        top: calc(50px + ((100vh - 50px) / 2));
      }

      .sidebar-btn {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }

      .contact-card {
        padding: 1.6rem;
      }

      .contact-row {
        font-size: 0.98rem;
      }
    }

    @media screen and (max-width: 560px) {
      .topbar {
        justify-content: center;
      }

      .topbar-brand {
        display: none;
      }

      .topbar-btn {
        font-size: 0.76rem;
        padding: 0.28rem 0.38rem;
      }
    }
  </style>
</head>

<body>

  <div class="fade-overlay"></div>

  <nav class="topbar" aria-label="Top navigation">
    <div class="topbar-links">
      <button class="topbar-btn active" data-index="0" title="Home" type="button">Home</button>
      <button class="topbar-btn" data-index="1" title="Experience" type="button">Experience</button>
      <button class="topbar-btn" data-index="2" title="Projects" type="button">Projects</button>
      <button class="topbar-btn" data-index="3" title="Writing" type="button">Writing</button>
      <button class="topbar-btn" data-index="4" title="Contact" type="button">Contact</button>
    </div>

    <div class="topbar-brand">
      <img
        src="website-images/circlecroppedme.png"
        alt="Bryce Larson"
        class="topbar-photo"
      >

      <span class="topbar-name">Bryce Larson</span>
    </div>
  </nav>

  <nav class="sidebar" aria-label="Side page navigation">
    <button class="sidebar-btn active" data-index="0" title="Home" type="button">🏠</button>
    <button class="sidebar-btn" data-index="1" title="Experience" type="button">💼</button>
    <button class="sidebar-btn" data-index="2" title="Projects" type="button">🚀</button>
    <button class="sidebar-btn" data-index="3" title="Writing" type="button">📖</button>
    <button class="sidebar-btn" data-index="4" title="Contact" type="button">✉️</button>
  </nav>

  <main class="scroll-container" id="scroller">

    <section class="page" id="home">
      <div class="section-content hero">
        <h1>BRYCE LARSON</h1>

        <div class="divider"></div>

        <div class="social-links">
          <a
            href="https://linkedin.com/in/YOUR_USERNAME"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <i class="fa-brands fa-linkedin"></i>
          </a>

          <a
            href="https://instagram.com/YOUR_USERNAME"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>

          <a
            href="https://github.com/Eclipse718"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
          >
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
    </section>

    <section class="page" id="experience">
      <div class="section-content">
        <h2>EXPERIENCE</h2>
        <p>Coming soon.</p>
      </div>
    </section>

    <section class="page" id="projects">
      <div class="section-content">
        <h2>PROJECTS</h2>
        <p>Coming soon.</p>
      </div>
    </section>

    <section class="page" id="writing">
      <div class="section-content">
        <h2>WRITING</h2>
        <p>Coming soon.</p>
      </div>
    </section>

    <section class="page" id="contact">
      <div class="section-content">
        <div class="contact-card">
          <h2>Contact Information</h2>

          <div class="contact-row">
            <i class="fa-solid fa-envelope"></i>
            <a href="mailto:brycelarson718@gmail.com">brycelarson718@gmail.com</a>
          </div>

          <div class="contact-row">
            <i class="fa-solid fa-location-dot"></i>
            <span>Seattle, Washington</span>
          </div>

          <div class="contact-socials">
            <a
              href="https://instagram.com/YOUR_USERNAME"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
            >
              <i class="fa-brands fa-instagram"></i>
            </a>

            <a
              href="https://linkedin.com/in/YOUR_USERNAME"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <i class="fa-brands fa-linkedin"></i>
            </a>

            <a
              href="https://github.com/Eclipse718"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
            >
              <i class="fa-brands fa-github"></i>
            </a>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const pages = document.querySelectorAll('.page');
    const topbarBtns = document.querySelectorAll('.topbar-btn');
    const sidebarBtns = document.querySelectorAll('.sidebar-btn');
    const allNavBtns = document.querySelectorAll('.topbar-btn, .sidebar-btn');

    allNavBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const index = Number.parseInt(btn.dataset.index, 10);

        if (pages[index]) {
          pages[index].scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          const index = Array.from(pages).indexOf(entry.target);

          topbarBtns.forEach((btn) => btn.classList.remove('active'));
          sidebarBtns.forEach((btn) => btn.classList.remove('active'));

          if (topbarBtns[index]) {
            topbarBtns[index].classList.add('active');
          }

          if (sidebarBtns[index]) {
            sidebarBtns[index].classList.add('active');
          }
        }
      });
    }, {
      threshold: 0.5,
      root: document.querySelector('#scroller')
    });

    pages.forEach((page) => observer.observe(page));
  </script>

</body>
</html>
