<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bryce Larson</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      position: relative;
      background-image: url("website-images/Suzzallo_Library_at_UW_9572958209-1030x773.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Times New Roman", Times, serif;
      overflow: hidden;
    }

    /* Overlay */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1B2133BF;
      z-index: 1;
    }

    h1 {
      position: relative;
      z-index: 2;
      color: white;
      font-size: 4rem;
      font-weight: normal;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
      margin: 0;
    }
  </style>
</head>

<body>
  <h1>Bryce Larson</h1>
</body>
</html>
