<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bryce Larson</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Times New Roman", Times, serif;
      background: #0f1420;
    }

    .fade-overlay {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 300;
      animation: fadeOut 2.2s ease forwards;
      pointer-events: none;
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* ======================
       Top Bar
    ====================== */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 200;
      width: 100%;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: rgba(15, 20, 32, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(201, 169, 110, 0.24);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #f5f0e8;
      white-space: nowrap;
    }

    .topbar-photo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 1.5px solid #c9a96e;
      background: white;
    }

    .topbar-name {
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .topbar-links {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .topbar-btn {
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      padding: 0.34rem 0.78rem;
      border-radius: 999px;
      background: transparent;
      color: #c9a96e;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .topbar-btn.active {
      background: #1b2c52;
      color: #f5f0e8;
    }

    .topbar-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.08);
      color: #f0d899;
      transform: translateY(-1px);
    }

    /* ======================
       Scroll Container
    ====================== */

    .scroll-container {
      position: fixed;
      top: 54px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: auto;
      scrollbar-color: #c9a96e #1a1a2e;
      background: #0f1420;
    }

    .scroll-container::-webkit-scrollbar {
      width: 13px;
    }

    .scroll-container::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background-color: #c9a96e;
      border-radius: 999px;
      border: 2px solid #1a1a2e;
    }

    .page {
      width: 100%;
      min-height: calc(100vh - 54px);
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0 1.5rem;
    }

    #home {
      background-image: url("website-images/Suzzallo_Library.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #home::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          rgba(15, 20, 32, 0.62),
          rgba(15, 20, 32, 0.78)
        );
      z-index: 1;
    }

    #experience,
    #projects,
    #writing {
      background:
        radial-gradient(circle at center, rgba(27, 44, 82, 0.45), transparent 45%),
        #0f1420;
    }

    .section-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      text-align: center;
      color: white;
    }

    .hero h1 {
      margin: 0 0 1.2rem 0;
      color: white;
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      font-weight: normal;
      letter-spacing: 0.2em;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.75);
    }

    .divider {
      width: 150px;
      height: 1px;
      background-color: #c9a96e;
      margin: 0 auto 1.4rem auto;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }

    .social-links a {
      color: #c9a96e;
      font-size: 2.4rem;
      text-decoration: none;
      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    .social-links a:hover {
      color: #f0d899;
      transform: translateY(-2px);
    }

    .section-content h2 {
      margin: 0;
      color: #f5f0e8;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: normal;
      letter-spacing: 0.15em;
    }

    .section-content p {
      margin-top: 0.8rem;
      color: #b8b8b8;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    /* ======================
       Sidebar
    ====================== */

    .sidebar {
      position: fixed;
      right: 2rem;
      top: calc(54px + ((100vh - 54px) / 2));
      transform: translateY(-50%);
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .sidebar-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(201, 169, 110, 0.22);
      border-radius: 50%;
      background: rgba(15, 20, 32, 0.46);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background 0.25s ease,
        transform 0.25s ease,
        border-color 0.25s ease;
    }

    .sidebar-btn.active {
      background: #1b2c52;
      border-color: rgba(201, 169, 110, 0.7);
    }

    .sidebar-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.08);
    }

    /* ======================
       Writing Book
    ====================== */

    .writing-stage {
      width: min(900px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
    }

    .book-instruction {
      margin: 0;
      color: #c9a96e;
      font-size: 1rem;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .book-wrapper {
      position: relative;
      width: min(560px, 88vw);
      height: 360px;
      perspective: 1500px;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      transform-style: preserve-3d;
      outline: none;
    }

    .book-shadow {
      position: absolute;
      left: 50%;
      bottom: -24px;
      width: 78%;
      height: 32px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.38);
      filter: blur(8px);
      transition:
        width 0.7s ease,
        opacity 0.7s ease;
    }

    .book-cover {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      border-radius: 12px 22px 22px 12px;
      background:
        linear-gradient(90deg, rgba(45, 18, 14, 0.95), rgba(98, 42, 27, 0.98) 42%, rgba(138, 68, 35, 0.98));
      box-shadow:
        inset 10px 0 18px rgba(0, 0, 0, 0.28),
        inset -6px 0 14px rgba(255, 220, 150, 0.12),
        0 24px 45px rgba(0, 0, 0, 0.48);
      border: 2px solid rgba(201, 169, 110, 0.5);
      transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
      z-index: 4;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      top: 16px;
      left: 18px;
      right: 18px;
      bottom: 16px;
      border: 1px solid rgba(240, 216, 153, 0.55);
      border-radius: 8px 18px 18px 8px;
      pointer-events: none;
    }

    .book-cover::after {
      content: "";
      position: absolute;
      top: 0;
      left: 52px;
      width: 16px;
      height: 100%;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.28),
          rgba(255, 255, 255, 0.08),
          rgba(0, 0, 0, 0.2)
        );
      opacity: 0.9;
    }

    .book-cover-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      color: #f5f0e8;
      text-align: center;
      backface-visibility: hidden;
    }

    .book-cover-content i {
      color: #c9a96e;
      font-size: 4rem;
      margin-bottom: 1.1rem;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    }

    .book-cover-title {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: normal;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
    }

    .book-cover-subtitle {
      margin: 0.8rem 0 0;
      color: #c9a96e;
      font-size: 1rem;
      letter-spacing: 0.12em;
    }

    .book-pages {
      position: absolute;
      inset: 12px 10px 12px 16px;
      border-radius: 9px 18px 18px 9px;
      background:
        repeating-linear-gradient(
          0deg,
          #efe5d0,
          #efe5d0 10px,
          #e3d4bb 11px
        );
      box-shadow:
        0 20px 35px rgba(0, 0, 0, 0.38),
        inset -10px 0 18px rgba(139, 100, 62, 0.2);
      z-index: 2;
    }

    .book-page {
      position: absolute;
      top: 18px;
      bottom: 18px;
      width: calc(50% - 18px);
      background: #f7eedb;
      color: #1b2133;
      box-shadow: inset 0 0 18px rgba(90, 54, 24, 0.1);
      z-index: 3;
      overflow: hidden;
    }

    .book-page-left {
      left: 20px;
      border-radius: 8px 2px 2px 8px;
    }

    .book-page-right {
      right: 18px;
      border-radius: 2px 12px 12px 2px;
    }

    .book-page::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.08),
          transparent 18%,
          transparent 80%,
          rgba(0, 0, 0, 0.05)
        );
      pointer-events: none;
    }

    .writing-list {
      position: relative;
      z-index: 5;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.4rem;
      opacity: 0;
      transform: translateY(8px);
      transition:
        opacity 0.5s ease 0.35s,
        transform 0.5s ease 0.35s;
    }

    .writing-list h3 {
      margin: 0 0 0.9rem;
      color: #5a2e1e;
      font-size: 1.25rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .writing-list ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .writing-list li {
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(90, 46, 30, 0.18);
      color: #1b2133;
      font-size: 0.98rem;
      letter-spacing: 0.03em;
      text-align: left;
    }

    .writing-list a {
      color: #1b2133;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .writing-list a:hover {
      color: #8a4423;
    }

    .book.open .book-cover {
      transform: rotateY(-142deg);
    }

    .book.open .writing-list {
      opacity: 1;
      transform: translateY(0);
    }

    .book.open + .book-shadow {
      width: 92%;
      opacity: 0.75;
    }

    /* ======================
       Contact Modal
    ====================== */

    .contact-modal {
      position: fixed;
      inset: 0;
      z-index: 250;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(5, 8, 14, 0.72);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .contact-modal.open {
      display: flex;
    }

    .contact-card {
      position: relative;
      width: min(520px, 92vw);
      padding: 2.2rem;
      border: 1px solid rgba(201, 169, 110, 0.35);
      border-radius: 18px;
      background: rgba(15, 20, 32, 0.92);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      text-align: left;
      color: white;
    }

    .contact-close {
      position: absolute;
      top: 0.85rem;
      right: 0.9rem;
      border: none;
      background: transparent;
      color: #c9a96e;
      font-size: 1.4rem;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .contact-close:hover {
      color: #f0d899;
    }

    .contact-card h2 {
      margin: 0 0 1.5rem 0;
      text-align: center;
      color: #f5f0e8;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      font-weight: normal;
      letter-spacing: 0.1em;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin: 1rem 0;
      color: #f5f0e8;
      font-size: 1.08rem;
      letter-spacing: 0.03em;
    }

    .contact-row i {
      width: 28px;
      color: #c9a96e;
      font-size: 1.25rem;
      text-align: center;
    }

    .contact-row a {
      color: #f5f0e8;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .contact-row a:hover {
      color: #f0d899;
    }

    .contact-socials {
      display: flex;
      justify-content: center;
      gap: 1.7rem;
      margin-top: 1.8rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(201, 169, 110, 0.25);
    }

    .contact-socials a {
      color: #c9a96e;
      font-size: 2rem;
      text-decoration: none;
      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    .contact-socials a:hover {
      color: #f0d899;
      transform: translateY(-2px);
    }

    /* ======================
       Mobile
    ====================== */

    @media screen and (max-width: 760px) {
      .topbar {
        height: 50px;
        padding: 0 0.8rem;
      }

      .topbar-photo {
        width: 30px;
        height: 30px;
      }

      .topbar-name {
        font-size: 0.85rem;
        letter-spacing: 0.05em;
      }

      .topbar-links {
        gap: 0.12rem;
      }

      .topbar-btn {
        padding: 0.28rem 0.42rem;
        font-size: 0.78rem;
      }

      .scroll-container {
        top: 50px;
      }

      .page {
        min-height: calc(100vh - 50px);
      }

      .hero h1 {
        letter-spacing: 0.14em;
      }

      .sidebar {
        right: 0.75rem;
        top: calc(50px + ((100vh - 50px) / 2));
      }

      .sidebar-btn {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }

      .book-wrapper {
        height: 315px;
      }

      .book-cover-content i {
        font-size: 3.2rem;
      }

      .book-cover-title {
        letter-spacing: 0.12em;
      }

      .writing-list {
        padding: 1rem;
      }

      .writing-list h3 {
        font-size: 1.05rem;
      }

      .writing-list li {
        font-size: 0.86rem;
        padding: 0.35rem 0;
      }

      .contact-card {
        padding: 1.6rem;
      }

      .contact-row {
        font-size: 0.98rem;
      }
    }

    @media screen and (max-width: 620px) {
      .topbar {
        justify-content: center;
      }

      .topbar-brand {
        display: none;
      }

      .topbar-btn {
        font-size: 0.76rem;
        padding: 0.28rem 0.38rem;
      }
    }

    @media screen and (max-width: 520px) {
      .book-wrapper {
        height: 280px;
      }

      .book-page {
        top: 15px;
        bottom: 15px;
      }

      .book-page-left {
        left: 16px;
      }

      .book-page-right {
        right: 14px;
      }

      .writing-list li {
        font-size: 0.78rem;
      }
    }
  </style>
</head>

<body>

  <div class="fade-overlay"></div>

  <nav class="topbar" aria-label="Top navigation">
    <div class="topbar-brand">
      <img
        src="website-images/circlecroppedme.png"

        class="topbar-photo"
      >

      <span class="topbar-name">Bryce Larson</span>

    </div>
  </nav>

  <nav class="sidebar" aria-label="Side page navigation">
    <button class="sidebar-btn active" data-index="0" title="Home" type="button">🏠</button>
    <button class="sidebar-btn" data-index="1" title="Experience" type="button">💼</button>
    <button class="sidebar-btn" data-index="2" title="Projects" type="button">🚀</button>
    <button class="sidebar-btn" data-index="3" title="Writing" type="button">📖</button>
  </nav>

  <main class="scroll-container" id="scroller">

    <section class="page" id="home">
      <div class="section-content hero">
        <h1>BRYCE LARSON</h1>

        <div class="divider"></div>

        <div class="social-links">
          <a
            href="https://linkedin.com/in/YOUR_USERNAME"

            <i class="fa-brands fa-linkedin"></i>
          </a>

          <a
            href="https://instagram.com/YOUR_USERNAME"
            target="_blank"
            rel="noopener noreferrer"

          >
            <i class="fa-brands fa-instagram"></i>
          </a>

          <a

            rel="noopener noreferrer"

  </main>

  <div class="contact-modal" id="contactModal" aria-hidden="true">

      <div class="contact-row">

          aria-label="GitHub"
        >
          <i class="fa-brands fa-github"></i>
        </a>
      </div>
    </div>
  </div>

  <script>
    const scroller = document.querySelector('#scroller');
    const pages = document.querySelectorAll('.page');
    const topbarPageBtns = document.querySelectorAll('.topbar-btn[data-index]');
    const sidebarBtns = document.querySelectorAll('.sidebar-btn');
    const allPageNavBtns = document.querySelectorAll('.topbar-btn[data-index], .sidebar-btn');

    const contactOpenBtn = document.querySelector('.contact-open-btn');
    const contactModal = document.querySelector('#contactModal');
    const contactCloseBtn = document.querySelector('.contact-close');

    const book = document.querySelector('.book');

    allPageNavBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const index = Number.parseInt(btn.dataset.index, 10);

        if (pages[index]) {
          pages[index].scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });

    book.addEventListener('click', () => {
      const isOpen = book.classList.toggle('open');
      book.setAttribute('aria-expanded', String(isOpen));
    });

    contactOpenBtn.addEventListener('click', () => {
      contactModal.classList.add('open');
      contactModal.setAttribute('aria-hidden', 'false');
      contactOpenBtn.classList.add('active');
    });

    function closeContactModal() {
      contactModal.classList.remove('open');
      contactModal.setAttribute('aria-hidden', 'true');
      contactOpenBtn.classList.remove('active');
    }

    contactCloseBtn.addEventListener('click', closeContactModal);

    contactModal.addEventListener('click', (event) => {
      if (event.target === contactModal) {
        closeContactModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && contactModal.classList.contains('open')) {
        closeContactModal();
      }
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          const index = Array.from(pages).indexOf(entry.target);

          topbarPageBtns.forEach((btn) => btn.classList.remove('active'));
          sidebarBtns.forEach((btn) => btn.classList.remove('active'));

          if (topbarPageBtns[index]) {
            topbarPageBtns[index].classList.add('active');
          }

          if (sidebarBtns[index]) {
            sidebarBtns[index].classList.add('active');
          }
        }
      });
    }, {
      threshold: 0.5,
      root: scroller
    });

    pages.forEach((page) => observer.observe(page));
  </script>

</body>
</html>
