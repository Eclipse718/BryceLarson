<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bryce Larson</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    body {
      position: relative;
      background-image: url("website-images/Suzzallo_Library_at_UW_9572958209-1030x773.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Times New Roman", Times, serif;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1B2133BF;
      z-index: 1;
    }
    .hero {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 8vh;
    }
    h1 {
      color: white;
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: 0.2em;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
      margin: 0 0 1.2rem 0;
    }
    .divider {
      width: 60px;
      height: 1px;
      background-color: #c9a96e;
      margin: 0 auto 1.4rem auto;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
    }
    .social-links a {
      color: #c9a96e;
      font-size: 1.6rem;
      text-decoration: none;
      transition: color 0.25s ease;
    }
    .social-links a:hover {
      color: #f0d899;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>BRYCE LARSON</h1>
    <div class="divider"></div>
    <div class="social-links">
      <a href="https://instagram.com/YOUR_USERNAME" target="_blank" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://linkedin.com/in/YOUR_USERNAME" target="_blank" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin"></i>
      </a>
      <a href="https://github.com/YOUR_USERNAME" target="_blank" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
  </div>
</body>
</html>
