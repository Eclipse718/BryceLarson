title: "Bryce Larson"
tagline: "Librarian · Researcher · Curator"
description: >
  Personal portfolio and writing of Bryce Larson.

baseurl: ""
url: "https://yourusername.github.io"

author:
  name: "Bryce Larson"
  email: "you@example.com"

theme: minima

minima:
  skin: classic

  social_links:
    - { platform: github, user_url: "https://github.com/yourusername" }
    - { platform: linkedin, user_url: "https://linkedin.com/in/yourprofile" }

header_pages:
  - about.md
  - writing.md
  - projects.md
  - contact.md

show_excerpts: true
permalink: /writing/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
