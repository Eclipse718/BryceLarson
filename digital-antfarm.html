<head>

  <link rel="stylesheet" href="css/style.css?v=26">

  <style>
    .project-detail-page {
      padding-top: 10rem;
    }

    .project-detail-header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .project-gallery {
      width: min(1200px, 94vw);
      margin: 0 auto 4rem;
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }

    .project-media-card,
    .project-info-card {
      text-align: center;
      padding: 1.5rem;
      border: 1px solid rgba(201, 169, 110, 0.35);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    .project-media-card {
      width: 100%;
      position: relative;
    }

    .floating-back-button {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201, 169, 110, 0.55);
      color: #f5f0e8;
      text-decoration: none;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .floating-back-button:hover {
      background: rgba(201, 169, 110, 0.18);
      border-color: rgba(201, 169, 110, 0.9);
      transform: translateY(-1px);
    }

    .project-media-card img,
    .project-media-card video {
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      display: block;
      border-radius: 14px;
      border: 2px solid rgba(201, 169, 110, 0.65);
      background: #030c12;
    }
  </style>
</head>
